<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="og.css">
<style>
  body { background: #1a1d3a; }
  .town { position: absolute; inset: 0; width: 1200px; height: 630px; object-fit: cover; object-position: 70% 62%; }
  .shade { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(17,19,44,.94) 0%, rgba(17,19,44,.82) 30%, rgba(17,19,44,.35) 56%, rgba(17,19,44,0) 72%),
      linear-gradient(0deg, rgba(17,19,44,.55) 0%, rgba(17,19,44,0) 30%); }
  .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .eyebrow { align-self: flex-start; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); color: #e7ebf5; }
  .wordmark { font-size: 104px; margin-bottom: 4px; }
  .pitch { font-size: 31px; line-height: 1.28; color: rgba(243,241,234,.9); }
  .url { position: absolute; left: 76px; bottom: 44px; color: rgba(231,235,245,.62); }
</style></head>
<body>
  <img class="town" src="/video/assets/img/town-fx-dusk-close.png" alt="">
  <div class="shade"></div>
  <div class="copy">
    <div class="eyebrow"><span class="dots"><i></i><i></i><i></i></span>A tiny transit town</div>
    <h1 class="wordmark wordmark--dark">HEADWAY</h1>
    <p class="pitch">AI planners teach the town’s bus dispatcher. Try to beat it.</p>
  </div>
  <div class="url">headway.pranavkarra.me</div>
</body></html>
