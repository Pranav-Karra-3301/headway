<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="og.css">
<style>
  body { background: linear-gradient(180deg, #cd8c86 0%, #b07a88 38%, #6a5280 62%, #2c2b6b 86%, #242767 100%); }
  .island { position: absolute; left: 90px; top: 168px; width: 1020px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 9%, #000 91%, transparent 100%), linear-gradient(180deg, transparent 0%, #000 18%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .top { position: absolute; left: 0; right: 0; top: 0; height: 260px;
    background: linear-gradient(180deg, rgba(205,140,134,1) 0%, rgba(205,140,134,.9) 45%, rgba(205,140,134,0) 100%); }
  .copy { position: absolute; left: 0; right: 0; top: 50px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .wordmark { font-size: 92px; color: #fff8ec; text-shadow: 0 4px 0 #a9666f, 0 8px 0 rgba(120,70,100,.5), 0 20px 40px rgba(60,30,70,.35); }
  .pitch { font-size: 28px; line-height: 1.25; color: #3b2242; display: flex; align-items: center; gap: 14px; }
  .url { position: absolute; right: 44px; bottom: 34px; color: rgba(255,248,236,.72); }
</style></head>
<body>
  <img class="island" src="/video/assets/img/world-dusk.png" alt="">
  <div class="top"></div>
  <div class="copy">
    <h1 class="wordmark">HEADWAY</h1>
    <p class="pitch"><span class="dots"><i></i><i></i><i></i></span>AI planners teach the town’s bus dispatcher. Try to beat it.</p>
  </div>
  <div class="url">headway.pranavkarra.me</div>
</body></html>
