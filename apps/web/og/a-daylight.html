<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="og.css">
<style>
  body { background: radial-gradient(90% 120% at 18% 40%, #eef7f1 0%, #ddefe5 55%, #cfe5d8 100%); }
  .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .eyebrow { align-self: flex-start; background: rgba(255, 251, 242, 0.85); color: color-mix(in srgb, var(--ink) 72%, transparent);
    box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 4px 14px rgba(31,42,68,.08); }
  .wordmark { font-size: 98px; margin-bottom: 4px; }
  .pitch { font-size: 31px; line-height: 1.28; color: color-mix(in srgb, var(--ink) 82%, transparent); }
  .url { position: absolute; left: 76px; bottom: 44px; color: color-mix(in srgb, var(--ink) 55%, transparent); }
  .shot { position: absolute; left: 574px; top: 92px; width: 760px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(31,42,68,.08), 0 30px 70px rgba(31,42,68,.22), 0 8px 18px rgba(31,42,68,.1); }
  .shot img { width: 100%; }
</style></head>
<body>
  <div class="copy">
    <div class="eyebrow"><span class="dots"><i></i><i></i><i></i></span>A tiny transit town</div>
    <h1 class="wordmark wordmark--light">HEADWAY</h1>
    <p class="pitch">AI planners teach the town’s bus dispatcher. Try to beat it.</p>
  </div>
  <div class="url">headway.pranavkarra.me</div>
  <div class="shot"><img src="/video/assets/img/integrated-watch.png" alt=""></div>
</body></html>
