<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headway · town FX preview (T2.4)</title>
    <link rel="preload" href="/fonts/GumballRounded.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face { font-family: "Gumball Rounded"; src: url("/fonts/GumballRounded.ttf") format("truetype"); font-display: block; }
      :root { --ink: #1F2A44; --paper: #FFFBF2; --accent: #2E5BDA; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #DDEFE5; color: var(--ink);
        font-family: "Avenir Next Rounded Std", Nunito, ui-rounded, system-ui, sans-serif; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .gb { font-family: "Gumball Rounded", "Avenir Next Rounded Std", ui-rounded, sans-serif; font-weight: 400; }
      .brand { position: fixed; top: 22px; left: 28px; pointer-events: none; transition: color .4s; }
      .brand h1 { margin: 0; font-size: 52px; line-height: 1; }
      .brand p { margin: 8px 0 0 3px; font-size: 15px; opacity: .62; }
      .clock { position: fixed; top: 104px; left: 30px; font-size: 22px; pointer-events: none; }
      body.dusk .brand, body.dusk .clock, body.dusk #stats { color: #FFF4E2; }
      .panel { position: fixed; top: 18px; right: 18px; background: var(--paper); border-radius: 18px; padding: 12px 14px;
        box-shadow: 0 10px 30px rgba(20,30,50,.14); display: grid; gap: 8px; }
      .row { display: flex; gap: 6px; align-items: center; }
      .row .lbl { width: 70px; font-size: 14px; opacity: .55; }
      .chip { border: 0; border-radius: 999px; padding: 7px 13px; font-size: 15px; background: rgba(31,42,68,.07); color: var(--ink); cursor: pointer; }
      .chip.on { background: var(--accent); color: #fff; }
      #stats { position: fixed; left: 28px; bottom: 20px; font-size: 13px; opacity: .65; }
      body.nolabels .panel, body.nolabels #stats { display: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="brand"><h1 class="gb">HEADWAY</h1><p class="gb" id="sub">town fx</p></div>
    <div class="clock gb" id="clock"></div>
    <div class="panel">
      <div class="row"><span class="lbl gb">Light</span>
        <button class="chip gb" data-k="light" data-v="day">Day</button>
        <button class="chip gb" data-k="light" data-v="dusk">Dusk</button>
      </div>
      <div class="row"><span class="lbl gb">Palette</span>
        <button class="chip gb" data-k="palette" data-v="a">A</button>
        <button class="chip gb" data-k="palette" data-v="b">B</button>
        <button class="chip gb" data-k="palette" data-v="c">C</button>
      </div>
      <div class="row"><span class="lbl gb">Route</span>
        <button class="chip gb" data-k="hl" data-v="">All</button>
        <button class="chip gb" data-k="hl" data-v="r1">R1</button>
        <button class="chip gb" data-k="hl" data-v="r2">R2</button>
        <button class="chip gb" data-k="hl" data-v="r3">R3</button>
      </div>
      <div class="row"><span class="lbl gb">Party</span><button class="chip gb" id="burst">Closing time</button></div>
    </div>
    <div id="stats" class="gb"></div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
