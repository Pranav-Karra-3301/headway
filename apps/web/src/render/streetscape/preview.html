<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Headway · streetscape preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #DDEFE5; font-family: "Avenir Next Rounded Std", Nunito, system-ui, sans-serif; }
      #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #msg { position: fixed; left: 14px; bottom: 10px; font-size: 13px; color: #1F2A44; opacity: .7; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="msg"></div>
    <script>
      const show = (t) => { const m = document.getElementById('msg'); m.style.cssText += ';color:#c00;opacity:1;font-size:18px'; m.textContent = t; };
      addEventListener('error', (e) => show('ERROR ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
      addEventListener('unhandledrejection', (e) => show('REJECT ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
    </script>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
